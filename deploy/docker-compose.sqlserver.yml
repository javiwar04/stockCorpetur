services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: stockcontrol-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - stockcontrol-sqlserver-data:/var/opt/mssql

volumes:
  stockcontrol-sqlserver-data:
